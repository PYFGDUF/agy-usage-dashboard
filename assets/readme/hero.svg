<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">AGY Usage Dashboard</title>
  <desc id="desc">Antigravity quota inside Codex. Graphite and sage typography with the panel's two quota-window bars.</desc>
  <rect width="1200" height="320" rx="22" fill="#1c1d1f"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="66" font-size="22" letter-spacing="3" fill="#a9b9a3">ANTIGRAVITY / CODEX MCP APPS</text>
    <text x="56" y="177" font-size="104" font-weight="600" letter-spacing="-5" fill="#f5f5f1">AGY Usage</text>
    <text x="60" y="246" font-size="32" fill="#b7b8bc">Antigravity quota, inside Codex.</text>
  </g>
  <g id="quota-window-motif" transform="translate(850 83)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="0" y="0" font-size="22" fill="#b7b8bc">Weekly</text>
    <rect x="0" y="23" width="285" height="12" rx="6" fill="#37383a"/>
    <rect x="0" y="23" width="220" height="12" rx="6" fill="#a9b9a3"/>
    <text x="0" y="98" font-size="22" fill="#b7b8bc">5-hour</text>
    <rect x="0" y="121" width="285" height="12" rx="6" fill="#37383a"/>
    <rect x="0" y="121" width="106" height="12" rx="6" fill="#a9b9a3"/>
  </g>
</svg>
