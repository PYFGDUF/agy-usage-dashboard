<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">AGY quota data flow</title>
  <desc id="desc">AGY CLI reads official quota, a local shared cache exposes it through MCP, and the Codex GUI renders the result.</desc>
  <rect width="1200" height="190" rx="18" fill="#f5f5f1"/>
  <g fill="#252729" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="500" text-anchor="middle">
    <text x="210" y="91">AGY CLI</text>
    <text x="600" y="91">Local cache</text>
    <text x="990" y="91">Codex GUI</text>
  </g>
  <g fill="#65696a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" text-anchor="middle">
    <text x="210" y="132">/usage</text><text x="600" y="132">Node.js · MCP</text><text x="990" y="132">MCP Apps</text>
  </g>
  <g fill="none" stroke="#536b4e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M355 90h77m-12-10 12 10-12 10"/><path d="M760 90h77m-12-10 12 10-12 10"/>
  </g>
</svg>
