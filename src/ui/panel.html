<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGY 用量面板</title>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 12px;
      --transition-fast: 0.12s ease;

      /* Dark graphite neutrals (Default) */
      --bg-canvas: #1b1b1d;
      --bg-primary: #1b1b1d;
      --bg-surface: #222225;
      --bg-surface-elevated: #28282c;
      --bg-surface-hover: #2f2f34;
      --border-subtle: #343438;
      --border-strong: #44444a;

      --text-primary: #f3f3f3;
      --text-secondary: #a8a8af;
      --text-muted: #929298;

      /* Desaturated sage accent */
      --accent-sage: #a6b7a0;
      --accent-sage-subtle: rgba(166, 183, 160, 0.12);
      --accent-sage-border: rgba(166, 183, 160, 0.28);

      /* Semantic alerts */
      --alert-amber: #e0a34e;
      --alert-amber-subtle: rgba(224, 163, 78, 0.12);
      --alert-amber-border: rgba(224, 163, 78, 0.28);

      --alert-terracotta: #e08a7e;
      --alert-terracotta-subtle: rgba(224, 138, 126, 0.12);
      --alert-terracotta-border: rgba(224, 138, 126, 0.28);

      --track-bg: #2c2c30;
      --focus-ring: #a6b7a0;
    }

    /* Host dark theme adaptation */
    html[data-theme="dark"], body[data-theme="dark"] {
      --bg-canvas: #1b1b1d;
      --bg-primary: #1b1b1d;
      --bg-surface: #222225;
      --bg-surface-elevated: #28282c;
      --bg-surface-hover: #2f2f34;
      --border-subtle: #343438;
      --border-strong: #44444a;

      --text-primary: #f3f3f3;
      --text-secondary: #a8a8af;
      --text-muted: #929298;

      --accent-sage: #a6b7a0;
      --accent-sage-subtle: rgba(166, 183, 160, 0.12);
      --accent-sage-border: rgba(166, 183, 160, 0.28);

      --alert-amber: #e0a34e;
      --alert-amber-subtle: rgba(224, 163, 78, 0.12);
      --alert-amber-border: rgba(224, 163, 78, 0.28);

      --alert-terracotta: #e08a7e;
      --alert-terracotta-subtle: rgba(224, 138, 126, 0.12);
      --alert-terracotta-border: rgba(224, 138, 126, 0.28);

      --track-bg: #2c2c30;
      --focus-ring: #a6b7a0;
    }

    /* Host warm-white light theme adaptation */
    html[data-theme="light"], body[data-theme="light"] {
      --bg-canvas: #f7f7f5;
      --bg-primary: #f7f7f5;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f0f0ed;
      --bg-surface-hover: #e8e8e4;
      --border-subtle: #e4e4e1;
      --border-strong: #cfcfca;

      --text-primary: #252528;
      --text-secondary: #5a5a62;
      --text-muted: #6a6a71;

      --accent-sage: #546c4f;
      --accent-sage-subtle: rgba(84, 108, 79, 0.08);
      --accent-sage-border: rgba(84, 108, 79, 0.25);

      --alert-amber: #8c5811;
      --alert-amber-subtle: rgba(140, 88, 17, 0.08);
      --alert-amber-border: rgba(140, 88, 17, 0.28);

      --alert-terracotta: #b84233;
      --alert-terracotta-subtle: rgba(184, 66, 51, 0.08);
      --alert-terracotta-border: rgba(184, 66, 51, 0.28);

      --track-bg: #ebebe7;
      --focus-ring: #546c4f;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill {
        transition: none !important;
      }
      .btn {
        transition: none !important;
      }
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 12px;
      min-width: 0;
      width: 100%;
    }

    .app-root {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      min-width: 0;
      box-sizing: border-box;
    }

    /* Header Bar */
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 8px 2px;
      background: transparent;
      border: none;
      min-width: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px 14px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .brand-accent {
      color: var(--accent-sage);
      font-weight: 500;
    }

    .header-status-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Unboxed ready connection badge (text + dot) */
    .badge-ready {
      background: transparent;
      border: none;
      padding: 0 2px;
      color: var(--text-secondary);
    }
    .badge-ready .badge-dot {
      background-color: var(--accent-sage);
    }

    .badge-refreshing {
      background-color: var(--alert-amber-subtle);
      color: var(--alert-amber);
      border: 1px solid var(--alert-amber-border);
    }
    .badge-refreshing .badge-dot {
      background-color: var(--alert-amber);
    }

    .badge-error {
      background-color: var(--alert-terracotta-subtle);
      color: var(--alert-terracotta);
      border: 1px solid var(--alert-terracotta-border);
    }
    .badge-error .badge-dot {
      background-color: var(--alert-terracotta);
    }

    .badge-stale {
      background-color: var(--alert-amber-subtle);
      color: var(--alert-amber);
      border: 1px solid var(--alert-amber-border);
      font-weight: 500;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lang-select {
      background-color: var(--bg-surface-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 3px 6px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      line-height: 1.3;
      transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
    }

    .lang-select:hover {
      background-color: var(--bg-surface-hover);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .lang-select:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .toggle-wrap {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: var(--text-secondary);
      user-select: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .toggle-wrap input[type="checkbox"] {
      accent-color: var(--accent-sage);
      cursor: pointer;
      margin: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      font-weight: 500;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface-elevated);
      color: var(--text-primary);
      cursor: pointer;
      white-space: nowrap;
      transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
    }

    .btn:hover:not(:disabled) {
      background-color: var(--bg-surface-hover);
      border-color: var(--border-strong);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-icon {
      font-size: 12px;
      line-height: 1;
    }

    /* Warning & Error Banner */
    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      line-height: 1.4;
      word-break: break-word;
    }

    .banner-error {
      background-color: var(--alert-terracotta-subtle);
      border: 1px solid var(--alert-terracotta-border);
      color: var(--alert-terracotta);
    }

    .banner-stale {
      background-color: var(--alert-amber-subtle);
      border: 1px solid var(--alert-amber-border);
      color: var(--alert-amber);
    }

    .banner-close {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 2px 4px;
      opacity: 0.8;
      border-radius: var(--radius-xs);
      flex-shrink: 0;
    }

    .banner-close:hover {
      opacity: 1;
    }

    /* Quota Grid */
    .quota-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 14px;
      min-width: 0;
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      min-width: 0;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .card-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .quota-items {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    .quota-item {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .quota-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      min-width: 0;
    }

    .window-label {
      font-weight: 500;
      color: var(--text-secondary);
      word-break: break-word;
    }

    .percent-group {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      flex-shrink: 0;
    }

    .low-warning-tag {
      background-color: var(--alert-terracotta-subtle);
      color: var(--alert-terracotta);
      border: 1px solid var(--alert-terracotta-border);
      padding: 1px 6px;
      border-radius: var(--radius-xs);
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }

    .percent-val {
      font-weight: 600;
      font-family: var(--font-sans);
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      font-size: 22px;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .quota-item.is-low .percent-val {
      color: var(--alert-terracotta);
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background-color: var(--track-bg);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background-color: var(--accent-sage);
      transition: width 0.25s ease;
    }

    .quota-item.is-low .progress-fill {
      background-color: var(--alert-terracotta);
    }

    .quota-sub-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 3px 8px;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
      min-width: 0;
    }

    .countdown-text {
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .countdown-text.is-passed {
      color: var(--alert-amber);
      font-weight: 500;
    }

    /* Tasks Section */
    .tasks-section {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .tasks-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 12px;
      min-width: 0;
    }

    .tasks-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tasks-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .tasks-count-pill {
      background-color: var(--bg-surface-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      padding: 1px 7px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .tasks-note {
      font-size: 11.5px;
      color: var(--text-muted);
      word-break: break-word;
    }

    .tasks-table-wrap {
      overflow-x: auto;
      max-height: 220px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background-color: var(--bg-surface);
      -webkit-overflow-scrolling: touch;
    }

    table.tasks-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      text-align: left;
    }

    table.tasks-table th {
      padding: 7px 10px;
      color: var(--text-muted);
      background-color: var(--bg-surface-elevated);
      border-bottom: 1px solid var(--border-subtle);
      font-weight: 500;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    table.tasks-table td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    table.tasks-table tbody tr:last-child td {
      border-bottom: none;
    }

    table.tasks-table tbody tr:hover {
      background-color: var(--bg-surface-elevated);
    }

    .task-id {
      font-family: var(--font-mono);
      font-weight: 500;
      color: var(--text-primary);
    }

    .status-tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: var(--radius-xs);
      font-size: 10.5px;
      font-weight: 500;
      line-height: 1.25;
    }

    .status-tag.running {
      background-color: var(--accent-sage-subtle);
      color: var(--accent-sage);
      border: 1px solid var(--accent-sage-border);
    }

    .status-tag.completed {
      background-color: var(--accent-sage-subtle);
      color: var(--accent-sage);
      border: 1px solid var(--accent-sage-border);
    }

    .status-tag.failed {
      background-color: var(--alert-terracotta-subtle);
      color: var(--alert-terracotta);
      border: 1px solid var(--alert-terracotta-border);
    }

    .status-tag.queued {
      background-color: var(--alert-amber-subtle);
      color: var(--alert-amber);
      border: 1px solid var(--alert-amber-border);
    }

    .status-tag.unknown {
      background-color: var(--bg-surface-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    .tasks-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .footer-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      padding: 2px 4px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }
      .app-root {
        gap: 12px;
      }
      .panel-header {
        padding: 6px 2px;
      }
      .card, .tasks-section {
        padding: 14px;
      }
      .quota-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .quota-items {
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="app-root" class="app-root">
    <!-- Header -->
    <header class="panel-header">
      <div class="header-left">
        <div class="brand-title">
          <span>AGY</span><span class="brand-accent">/</span><span id="brand-title-text">用量监控</span>
        </div>
        <div class="header-status-group">
          <div id="conn-badge" class="badge badge-ready">
            <span class="badge-dot"></span>
            <span id="conn-text">准备连接...</span>
          </div>
          <div id="stale-badge" class="badge badge-stale hidden">数据已过期 (>120s)</div>
        </div>
      </div>
      <div class="header-controls">
        <select id="lang-select" class="lang-select" aria-label="选择语言">
          <option value="zh-CN">中文</option>
          <option value="en">English</option>
        </select>
        <label class="toggle-wrap" id="auto-refresh-label" title="每5秒自动拉取缓存数据">
          <input type="checkbox" id="auto-refresh-toggle" checked>
          <span id="auto-refresh-text">自动同步</span>
        </label>
        <button id="refresh-btn" class="btn" title="立即发起配额刷新 (10秒冷却)">
          <span class="btn-icon">↻</span>
          <span id="refresh-btn-text">立即刷新</span>
        </button>
      </div>
    </header>

    <!-- Error Banner -->
    <div id="error-banner" class="banner banner-error hidden">
      <span id="error-message">执行异常</span>
      <button id="error-dismiss" class="banner-close" title="关闭">&times;</button>
    </div>

    <!-- Quota Grid -->
    <main id="quota-grid" class="quota-grid">
      <div class="card" style="text-align: center; color: var(--text-muted); padding: 30px;">
        <p id="quota-loading-text">正在读取配额...</p>
      </div>
    </main>

    <!-- Tasks Section -->
    <section class="tasks-section">
      <div class="tasks-header">
        <div class="tasks-title-wrap">
          <span id="tasks-title" class="tasks-title">Supervisor 任务记录</span>
          <span id="tasks-count" class="tasks-count-pill">0</span>
        </div>
        <span id="tasks-note" class="tasks-note">显式上报的任务记录</span>
      </div>
      <div id="tasks-empty" class="tasks-empty">
        暂无显式上报的任务事件
      </div>
      <div id="tasks-table-wrap" class="tasks-table-wrap hidden">
        <table class="tasks-table">
          <thead>
            <tr>
              <th id="th-task-id">任务 ID</th>
              <th id="th-model">模型</th>
              <th id="th-status">状态</th>
              <th id="th-tokens">Token (入 / 出)</th>
              <th id="th-time">上报时间 (CST)</th>
            </tr>
          </thead>
          <tbody id="tasks-body"></tbody>
        </table>
      </div>
    </section>

    <!-- Footer Meta -->
    <footer class="footer-meta">
      <span id="updated-at-text">更新时间: -</span>
      <span id="footer-note">定时采集 · 北京时间 (CST)</span>
    </footer>
  </div>

  <script>
    (function () {
      'use strict';

      // Elements
      const connBadge = document.getElementById('conn-badge');
      const connText = document.getElementById('conn-text');
      const staleBadge = document.getElementById('stale-badge');
      const refreshBtn = document.getElementById('refresh-btn');
      const refreshBtnText = document.getElementById('refresh-btn-text');
      const autoRefreshToggle = document.getElementById('auto-refresh-toggle');
      const errorBanner = document.getElementById('error-banner');
      const errorMessage = document.getElementById('error-message');
      const errorDismiss = document.getElementById('error-dismiss');
      const quotaGrid = document.getElementById('quota-grid');
      const tasksCount = document.getElementById('tasks-count');
      const tasksEmpty = document.getElementById('tasks-empty');
      const tasksTableWrap = document.getElementById('tasks-table-wrap');
      const tasksBody = document.getElementById('tasks-body');
      const updatedAtText = document.getElementById('updated-at-text');
      const appRoot = document.getElementById('app-root');
      const langSelect = document.getElementById('lang-select');

      // State
      let isInitialized = false;
      let disposed = false;
      let inFlight = false;
      let nextRpcId = 1;
      const pendingRequests = new Map();
      let pollTimer = null;
      let cooldownTimer = null;
      let cooldownSeconds = 0;
      let countdownTimer = null;
      let lastReportedWidth = 0;
      let lastReportedHeight = 0;
      let resizeDebounce = null;

      // Defensive localStorage access
      function getStorage() {
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            const testKey = '__agy_storage_test__';
            window.localStorage.setItem(testKey, '1');
            window.localStorage.removeItem(testKey);
            return window.localStorage;
          }
        } catch {
          // Sandbox or security denied
        }
        return null;
      }

      function normalizeLang(lang) {
        if (!lang || typeof lang !== 'string') return null;
        const l = lang.trim().toLowerCase();
        if (l.startsWith('zh')) return 'zh-CN';
        if (l.startsWith('en')) return 'en';
        return null;
      }

      function resolveInitialLanguage() {
        // 1. Saved valid preference
        const storage = getStorage();
        if (storage) {
          try {
            const saved = storage.getItem(STORAGE_KEY);
            const normalizedSaved = normalizeLang(saved);
            if (normalizedSaved) {
              return normalizedSaved;
            }
          } catch {
            // Ignore
          }
        }

        // 2. Navigator language(s) (zh=>zh-CN, others English, missing defaults Chinese)
        try {
          let nav = null;
          if (typeof window !== 'undefined' && window.navigator) {
            nav = window.navigator;
          } else if (typeof navigator !== 'undefined') {
            nav = navigator;
          }
          if (nav) {
            let primary = null;
            if (Array.isArray(nav.languages) && nav.languages.length > 0) {
              primary = nav.languages.find(l => typeof l === 'string' && l.trim().length > 0);
            } else if (typeof nav.language === 'string' && nav.language.trim().length > 0) {
              primary = nav.language;
            }
            if (primary) {
              const lower = primary.trim().toLowerCase();
              if (lower.startsWith('zh')) return 'zh-CN';
              return 'en';
            }
          }
        } catch {
          // Ignore
        }

        // 3. Missing defaults Chinese
        return 'zh-CN';
      }

      function saveLanguagePreference(lang) {
        const storage = getStorage();
        if (storage) {
          try {
            storage.setItem(STORAGE_KEY, lang);
          } catch {
            // Storage quota or denied
          }
        }
      }

      // Escape HTML
      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Format ISO string to Asia/Shanghai CST (UTC+8 in English)
      function formatShanghaiTime(isoString, lang = currentLang) {
        if (!isoString) return '-';
        try {
          const d = new Date(isoString);
          if (isNaN(d.getTime())) return String(isoString);
          const isEn = lang === 'en';
          const locale = isEn ? 'en-US' : 'zh-CN';
          const suffix = isEn ? ' UTC+8' : ' CST';
          return new Intl.DateTimeFormat(locale, {
            timeZone: 'Asia/Shanghai',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
          }).format(d) + suffix;
        } catch {
          return String(isoString);
        }
      }

      // Format countdown
      function getCountdownInfo(isoString, lang = currentLang) {
        const dict = I18N[lang] || I18N['zh-CN'];
        if (!isoString) return { text: '-', isPassed: false };
        const diffMs = new Date(isoString).getTime() - Date.now();
        if (diffMs <= 0) {
          return { text: dict.countdownExpired, isPassed: true };
        }
        const totalSeconds = Math.floor(diffMs / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = totalSeconds % 60;

        if (hours >= 24) {
          const days = Math.floor(hours / 24);
          const remHours = hours % 24;
          return { text: dict.countdownDays(days, remHours, mins), isPassed: false };
        }
        return { text: dict.countdownHours(hours, mins, secs), isPassed: false };
      }

      function formatWindowLabel(name, lang = currentLang) {
        if (!name) return '';
        const lower = name.toLowerCase();
        const dict = I18N[lang] || I18N['zh-CN'];
        if (lower.includes('weekly') && lower.includes('remaining')) return dict.windowWeeklyRemaining;
        if ((lower.includes('five hour') || lower.includes('5-hour') || lower.includes('5 hour')) && lower.includes('remaining')) return dict.windowFiveHourRemaining;
        if (lower.includes('weekly')) return dict.windowWeekly;
        if (lower.includes('five hour') || lower.includes('5-hour') || lower.includes('5 hour')) return dict.windowFiveHour;
        return name;
      }

      function formatGroupLabel(name, lang = currentLang) {
        const dict = I18N[lang] || I18N['zh-CN'];
        if (!name) return dict.quotaGeneralGroup;
        const lower = name.toLowerCase();
        if (lower.includes('gemini')) return dict.quotaGeminiGroup;
        if (lower.includes('claude') || lower.includes('gpt')) return dict.quotaClaudeGptGroup;
        return name;
      }

      // Apply theme
      function applyTheme(theme) {
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.body.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.body.setAttribute('data-theme', 'dark');
        }
      }

      // Detect system theme preference initially
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        applyTheme('light');
      }

      // Update manual refresh button UI state
      function updateRefreshBtnUI() {
        if (disposed) return;
        const dict = I18N[currentLang] || I18N['zh-CN'];
        if (inFlight) {
          refreshBtn.disabled = true;
          refreshBtnText.textContent = dict.refreshing;
        } else if (cooldownSeconds > 0) {
          refreshBtn.disabled = true;
          refreshBtnText.textContent = dict.cooldown(cooldownSeconds);
        } else {
          refreshBtn.disabled = false;
          refreshBtnText.textContent = dict.refreshNow;
        }
      }

      // Set language & update UI immediately
      function setLanguage(lang) {
        if (lang !== 'zh-CN' && lang !== 'en') return;
        currentLang = lang;
        saveLanguagePreference(lang);

        const dict = I18N[currentLang] || I18N['zh-CN'];
        if (document.documentElement) {
          document.documentElement.lang = currentLang;
          if (typeof document.documentElement.setAttribute === 'function') {
            document.documentElement.setAttribute('lang', currentLang);

        document.title = dict.docTitle;

        if (langSelect) {

          if (typeof langSelect.setAttribute === 'function') {

        // Update static DOM elements if present

        const autoRefLabel = document.getElementById('auto-refresh-label');

        const footerNoteEl = document.getElementById('footer-note');
        if (footerNoteEl) footerNoteEl.textContent = dict.footerNote;

        // Re-render button state (refreshing / cooldown / ready)
        updateRefreshBtnUI();

        // Re-render status if cached (without clearing active errors)
        if (lastKnownStatus) {
          renderStatus(lastKnownStatus, false);
        } else {
          // If no status yet, update initial connection badge text
          connText.textContent = dict.connConnecting;
          updatedAtText.textContent = dict.updatedAtPrefix + '-';
        }

        // Re-render error banner (translates prefix/fallback, preserves visibility and dismissed state)
        renderError();

      // Send JSON-RPC request to parent
      function sendRpcRequest(method, params, timeoutMs = 20000) {
        if (disposed) {
          const err = new Error('UI resource disposed');
          err.code = 'DISPOSED';
          return Promise.reject(err);
        }
        if (window.parent === window) {
          const dict = I18N[currentLang] || I18N['zh-CN'];
          const err = new Error(dict.errNotInIframe);
          err.code = 'NOT_IN_IFRAME';
          return Promise.reject(err);
        }
        const id = nextRpcId++;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pendingRequests.delete(id);
            const dict = I18N[currentLang] || I18N['zh-CN'];
            const err = new Error(dict.errTimeout(method, timeoutMs));
            err.code = 'TIMEOUT';
            err.rpcMethod = method;
            err.timeoutMs = timeoutMs;
            reject(err);
          }, timeoutMs);

          pendingRequests.set(id, { resolve, reject, timer });
          window.parent.postMessage({
            jsonrpc: '2.0',
            id,
            method,
            params
          }, '*');
        });
      }

      // Send JSON-RPC notification to parent
      function sendRpcNotification(method, params = {}) {
        if (disposed) return;
        if (window.parent === window) return;
        window.parent.postMessage({
          jsonrpc: '2.0',
          method,
          params
        }, '*');
      }

      // Notify parent of layout size changes
      function notifySize() {
        if (!isInitialized || disposed) return;
        if (resizeDebounce) clearTimeout(resizeDebounce);
        resizeDebounce = setTimeout(() => {
          resizeDebounce = null;
          if (!isInitialized || disposed) return;

          const docEl = document.documentElement;
          const body = document.body;
          // Use actual viewport width to prevent host width shrink loop
          const w = Math.ceil((docEl && docEl.clientWidth) || window.innerWidth || (appRoot ? appRoot.offsetWidth : 320));
          // Height includes body padding (12px top + 12px bottom = 24px)
          const rootScrollHeight = appRoot ? (appRoot.scrollHeight + 24) : 0;
          const docScrollHeight = docEl ? docEl.scrollHeight : 0;
          const bodyScrollHeight = body ? body.scrollHeight : 0;
          const h = Math.ceil(Math.max(rootScrollHeight, docScrollHeight, bodyScrollHeight, 300));

          if (Math.abs(h - lastReportedHeight) >= 4 || Math.abs(w - lastReportedWidth) >= 4) {
            lastReportedWidth = w;
            lastReportedHeight = h;
            sendRpcNotification('ui/notifications/size-changed', { width: w, height: h });
          }
        }, 100);
      }

      let currentError = null;
      let isErrorVisible = false;

      // Show/Hide error banner
      function showError(desc) {
        if (disposed) return;
        if (!desc) {
          clearError();
          return;
        }
        const descriptor = (typeof desc === 'string')
          ? { type: 'raw', detail: desc, format: () => desc }
          : desc;
        currentError = descriptor;
        isErrorVisible = true;
        renderError();
      }

      function hideError() {
        if (disposed) return;
        isErrorVisible = false;
        if (errorBanner) {
          errorBanner.classList.add('hidden');
        }
        notifySize();
      }

      function clearError() {
        if (disposed) return;
        currentError = null;
        isErrorVisible = false;
        if (errorBanner) {
          errorBanner.classList.add('hidden');
        }
        notifySize();
      }

      function renderError() {
        if (disposed || !errorBanner || !errorMessage) return;
        if (!isErrorVisible || !currentError) {
          errorBanner.classList.add('hidden');
          return;
        }
        const dict = I18N[currentLang] || I18N['zh-CN'];
        const text = typeof currentError.format === 'function'
          ? currentError.format(dict)
          : (currentError.detail || '');
        errorMessage.textContent = text;
        errorBanner.classList.remove('hidden');
        notifySize();
      }

      errorDismiss.addEventListener('click', hideError);

      // Render Status Data
      function renderStatus(status, isNewStatus = true) {
        if (disposed || !status) return;
        lastKnownStatus = status;
        const dict = I18N[currentLang] || I18N['zh-CN'];

        // Only update connection error state if newly arrived status from host
        if (isNewStatus) {
          const connErr = status.connection?.error;
          if (connErr) {
            const errText = typeof connErr === 'string'
              ? connErr
              : (connErr.message || JSON.stringify(connErr));
            showError({
              type: 'connection_error',
              detail: errText,
              format: () => errText
            });
          } else {
            clearError();
          }
        }

        // 1. Connection state badge
        const connState = status.connection?.state || 'ready';
        connBadge.className = 'badge';
        if (connState === 'ready') {
          connBadge.classList.add('badge-ready');
          connText.textContent = dict.connReady;
        } else if (connState === 'refreshing') {
          connBadge.classList.add('badge-refreshing');
          connText.textContent = dict.connRefreshing;
        } else if (connState === 'error') {
          connBadge.classList.add('badge-error');
          connText.textContent = dict.connError;
        } else {
          connBadge.classList.add('badge-ready');
          connText.textContent = connState;
        }

        // 2. Freshness & Stale (locally > 120s or server reported)
        const updatedAt = status.usage?.updatedAt;
        updatedAtText.textContent = `${dict.updatedAtPrefix}${formatShanghaiTime(updatedAt, currentLang)}`;
        const isServerStale = !!status.usage?.stale;
        const isLocallyStale = updatedAt ? (Date.now() - new Date(updatedAt).getTime() > 120000) : false;

        if (isServerStale || isLocallyStale) {
          staleBadge.textContent = dict.staleBadge;
          staleBadge.classList.remove('hidden');
        } else {
          staleBadge.classList.add('hidden');
        }

        // 3. Render Quota Windows
        const windows = status.usage?.windows || [];
        if (windows.length === 0) {
          quotaGrid.innerHTML = `
            <div class="card" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 30px;">
              <p>${escapeHtml(dict.quotaEmpty)}</p>
            </div>
          `;
        } else {
          // Group by model group
          const groups = new Map();
          for (const win of windows) {
            const g = win.group || '通用模型';
            if (!groups.has(g)) groups.set(g, []);
            groups.get(g).push(win);
          }

          let gridHtml = '';
          for (const [groupName, winList] of groups.entries()) {
            let itemsHtml = '';
            for (const win of winList) {
              const rawPercent = (typeof win.remainingPercent === 'number') ? win.remainingPercent : 0;
              const percent = Math.max(0, Math.min(100, rawPercent));
              const isLow = percent <= 20;
              const countdown = getCountdownInfo(win.resetsAt, currentLang);
              const resetCst = formatShanghaiTime(win.resetsAt, currentLang);
              const label = formatWindowLabel(win.window, currentLang);

              itemsHtml += `
                <div class="quota-item ${isLow ? 'is-low' : ''}" data-resets-at="${escapeHtml(win.resetsAt || '')}">
                  <div class="quota-meta-row">
                    <span class="window-label">${escapeHtml(label)}</span>
                    <div class="percent-group">
                      ${isLow ? `<span class="low-warning-tag">${escapeHtml(dict.lowAllowanceTag)}</span>` : ''}
                      <span class="percent-val">${percent}%</span>
                    </div>
                  </div>
                  <div class="progress-track" role="progressbar" aria-label="${escapeHtml(dict.progressAriaLabel(label, percent))}" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-fill" style="width: ${percent}%;"></div>
                  </div>
                  <div class="quota-sub-meta">
                    <span>${escapeHtml(dict.resetPrefix)}${escapeHtml(resetCst)}</span>
                    <span class="countdown-text ${countdown.isPassed ? 'is-passed' : ''}">${escapeHtml(countdown.text)}</span>
                  </div>
                </div>
              `;
            }

            gridHtml += `
              <div class="card">
                <div class="card-header">
                  <span class="card-title">${escapeHtml(formatGroupLabel(groupName, currentLang))}</span>
                  <span class="card-subtitle">${escapeHtml(dict.quotaWindowsCount(winList.length))}</span>
                </div>
                <div class="quota-items">
                  ${itemsHtml}
                </div>
              </div>
            `;
          }
          quotaGrid.innerHTML = gridHtml;
        }

        // 4. Render Tasks
        const tasks = Array.isArray(status.tasks) ? status.tasks : [];
        tasksCount.textContent = String(tasks.length);
        if (tasks.length === 0) {
          tasksEmpty.textContent = dict.tasksEmpty;
          tasksEmpty.classList.remove('hidden');
          tasksTableWrap.classList.add('hidden');
          tasksBody.innerHTML = '';
        } else {
          tasksEmpty.classList.add('hidden');
          tasksTableWrap.classList.remove('hidden');

          const statusMap = {
            queued: dict.statusQueued,
            running: dict.statusRunning,
            completed: dict.statusCompleted,
            failed: dict.statusFailed,
            unknown: dict.statusUnknown
          };

          let rowsHtml = '';
          for (const t of tasks) {
            const statusClass = ['queued', 'running', 'completed', 'failed'].includes(t.status) ? t.status : 'unknown';
            const statusLabel = statusMap[t.status] || t.status;
            const rawUsage = t.usage || {};
            const inputVal = rawUsage.inputTokens !== undefined ? rawUsage.inputTokens : rawUsage.input_tokens;
            const outputVal = rawUsage.outputTokens !== undefined ? rawUsage.outputTokens : rawUsage.output_tokens;
            const hasInput = (inputVal !== undefined && inputVal !== null);
            const hasOutput = (outputVal !== undefined && outputVal !== null);

            let usageText = dict.tokensMissing;
            if (hasInput || hasOutput) {
              const inp = hasInput ? Number(inputVal).toLocaleString() : dict.tokensMissing;
              const out = hasOutput ? Number(outputVal).toLocaleString() : dict.tokensMissing;
              usageText = `${inp} / ${out}`;
            }

            rowsHtml += `
              <tr>
                <td><span class="task-id">${escapeHtml(t.id)}</span></td>
                <td>${escapeHtml(t.model || '-')}</td>
                <td><span class="status-tag ${statusClass}">${escapeHtml(statusLabel)}</span></td>
                <td>${escapeHtml(usageText)}</td>
                <td>${escapeHtml(formatShanghaiTime(t.createdAt || t.updatedAt, currentLang))}</td>
              </tr>
            `;
          }
          tasksBody.innerHTML = rowsHtml;
        }

        notifySize();
      }

      // Fetch usage via tools/call agy_usage_get
      async function loadUsage(forceRefresh = false) {
        if (disposed || !isInitialized || inFlight) return;

        inFlight = true;
        updateRefreshBtnUI();

        try {
          const res = await sendRpcRequest('tools/call', {
            name: 'agy_usage_get',
            arguments: { force_refresh: forceRefresh }
          }, 35000);

          if (disposed) return;

          if (res && res.isError) {
            const rawDetail = res.content?.[0]?.text || null;
            showError({
              type: 'tool_failed',
              detail: rawDetail,
              format: (dict) => rawDetail || dict.errToolFailed
            });
          } else if (res && res.structuredContent) {
            renderStatus(res.structuredContent, true);
          } else if (res && res.content) {
            showError({
              type: 'tool_missing_structured',
              format: (dict) => dict.errToolMissingStructured
            });
          }
        } catch (err) {
          if (disposed) return;
          if (err?.code === 'TIMEOUT' || err?.rpcMethod) {
            const m = err.rpcMethod || 'tools/call';
            const ms = err.timeoutMs || 35000;
            showError({
              type: 'query_timeout',
              method: m,
              timeoutMs: ms,
              format: (dict) => dict.errTimeout(m, ms)
            });
          } else if (err?.code === 'NOT_IN_IFRAME' || err?.message === I18N['zh-CN'].errNotInIframe || err?.message === I18N['en'].errNotInIframe) {
            showError({
              type: 'not_in_iframe',
              format: (dict) => dict.errNotInIframe
            });
          } else if (!err?.message || err.message === I18N['zh-CN'].errQueryFailed || err.message === I18N['en'].errQueryFailed) {
            showError({
              type: 'query_fallback',
              format: (dict) => dict.errQueryFailed
            });
          } else {
            const rawMsg = err.message;
            showError({
              type: 'query_raw',
              detail: rawMsg,
              format: () => rawMsg
            });
          }
        } finally {
          if (!disposed) {
            inFlight = false;
            updateRefreshBtnUI();
          }
        }
      }

      // Polling control
      function startPolling() {
        stopPolling();
        if (disposed || !autoRefreshToggle.checked) return;
        pollTimer = setInterval(() => {
          if (!disposed && !document.hidden && isInitialized && !inFlight) {
            loadUsage(false);
          }
        }, 5000);
      }

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      // Cooldown timer (10s)
      function startCooldown(sec = 10) {
        if (disposed) return;
        cooldownSeconds = sec;
        updateRefreshBtnUI();
        if (cooldownTimer) clearInterval(cooldownTimer);
        cooldownTimer = setInterval(() => {
          cooldownSeconds--;
          if (cooldownSeconds <= 0) {
            clearInterval(cooldownTimer);
            cooldownTimer = null;
            cooldownSeconds = 0;
          }
          updateRefreshBtnUI();
        }, 1000);
      }

      function stopCooldown() {
        if (cooldownTimer) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
        }
        cooldownSeconds = 0;
      }

      // Dynamic countdowns update every second
      function startCountdowns() {
        stopCountdowns();
        if (disposed) return;
        countdownTimer = setInterval(() => {
          if (disposed) return;
          const items = document.querySelectorAll('.quota-item[data-resets-at]');
          if (items && typeof items.forEach === 'function') {
            items.forEach(el => {
              const resetsAt = el.getAttribute ? el.getAttribute('data-resets-at') : null;
              const countdownEl = el.querySelector ? el.querySelector('.countdown-text') : null;
              if (resetsAt && countdownEl) {
                const info = getCountdownInfo(resetsAt, currentLang);
                countdownEl.textContent = info.text;
                if (info.isPassed) {
                  if (countdownEl.classList && countdownEl.classList.add) countdownEl.classList.add('is-passed');
                } else {
                  if (countdownEl.classList && countdownEl.classList.remove) countdownEl.classList.remove('is-passed');
                }
              }
            });
          }

          // Check local staleness
          if (lastKnownStatus && lastKnownStatus.usage?.updatedAt) {
            const isOld = Date.now() - new Date(lastKnownStatus.usage.updatedAt).getTime() > 120000;
            const dict = I18N[currentLang] || I18N['zh-CN'];
            if (isOld || lastKnownStatus.usage.stale) {
              staleBadge.textContent = dict.staleBadge;
              staleBadge.classList.remove('hidden');
            } else {
              staleBadge.classList.add('hidden');
            }
          }
        }, 1000);
      }

      function stopCountdowns() {
        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }
      }

      function stopResizeDebounce() {
        if (resizeDebounce) {
          clearTimeout(resizeDebounce);
          resizeDebounce = null;
        }
      }

      function disconnectResizeObserver() {
        if (resizeObserver) {
          try {
            resizeObserver.disconnect();
          } catch {
            // Ignore
          }
          resizeObserver = null;
        }
      }

      // Perform resource teardown
      function performTeardown() {
        if (disposed) return;
        disposed = true;
        isInitialized = false;
        inFlight = false;

        stopPolling();
        stopCooldown();
        stopCountdowns();
        stopResizeDebounce();
        disconnectResizeObserver();

        for (const [id, req] of pendingRequests.entries()) {
          clearTimeout(req.timer);
          try {
            req.reject(new Error('UI resource disposed'));
          } catch {
            // Ignore
          }
        }
        pendingRequests.clear();
      }

      // Host Message Listener
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const msg = event.data;
        if (!msg || typeof msg !== 'object' || msg.jsonrpc !== '2.0') return;

        // If disposed, ignore any incoming message (ignore late data)
        if (disposed) return;

        // 1. Pending Request Response
        // Only accept response id when method is absent and result/error is present to prevent collision with host requests
        const isResponse = (msg.id !== undefined && !msg.method && (msg.result !== undefined || msg.error !== undefined));
        if (isResponse) {
          if (pendingRequests.has(msg.id)) {
            const { resolve, reject, timer } = pendingRequests.get(msg.id);
            clearTimeout(timer);
            pendingRequests.delete(msg.id);

            if (msg.error) {
              reject(new Error(msg.error.message || `RPC Error ${msg.error.code}`));
            } else {
              resolve(msg.result);
            }
          }
          return;
        }

        // 2. Host Requests & Notifications
        if (msg.method) {
          const method = msg.method;
          const params = msg.params;
          const isRequest = (msg.id !== undefined);

          if (method === 'ui/resource-teardown') {
            performTeardown();
            if (isRequest) {
              window.parent.postMessage({
                jsonrpc: '2.0',
                id: msg.id,
                result: {}
              }, '*');
            }
            return;
          }

          if (method === 'ui/notifications/teardown') {
            performTeardown();
            return;
          }

          if (method === 'ui/notifications/tool-result') {
            // Ext-apps spec passes CallToolResult directly in params, or optionally in params.result
            const toolRes = (params && params.result) ? params.result : params;
            if (toolRes) {
              if (toolRes.isError) {
                const rawDetail = toolRes.content?.[0]?.text || null;
                showError({
                  type: 'tool_call_error',
                  detail: rawDetail,
                  format: (dict) => rawDetail || dict.errToolCallError
                });
              } else if (toolRes.structuredContent) {
                renderStatus(toolRes.structuredContent, true);
              }
            }
            return;
          }

          if (method === 'ui/notifications/tool-cancelled') {
            return;
          }

          if (method === 'ui/notifications/host-context-changed') {
            const ctx = params?.hostContext || params;
            if (ctx && ctx.theme) {
              applyTheme(ctx.theme);
            }
            return;
          }

          // Unknown host request: respond with -32601 Method not found
          if (isRequest) {
            window.parent.postMessage({
              jsonrpc: '2.0',
              id: msg.id,
              error: {
                code: -32601,
                message: `Method not found: ${method}`
              }
            }, '*');
            return;
          }
        }
      });

      // UI Events
      refreshBtn.addEventListener('click', () => {
        if (disposed || inFlight || cooldownSeconds > 0) return;
        startCooldown(10);
        loadUsage(true);
      });

      autoRefreshToggle.addEventListener('change', () => {
        if (disposed) return;
        if (autoRefreshToggle.checked) {
          startPolling();
          loadUsage(false);
        } else {
          stopPolling();
        }
      });

      if (langSelect) {
        langSelect.addEventListener('change', (e) => {
          if (e && e.target && e.target.value) {
            setLanguage(e.target.value);
          }
        });
      }

      // Pause while hidden
      document.addEventListener('visibilitychange', () => {
        if (disposed || !isInitialized) return;
        if (document.hidden) {
          stopPolling();
        } else {
          if (autoRefreshToggle.checked) {
            loadUsage(false);
            startPolling();
          }
        }
      });

      // Observe size changes
      if (window.ResizeObserver && appRoot) {
        try {
          resizeObserver = new ResizeObserver(() => {
            if (isInitialized && !disposed) {
              notifySize();
            }
          });
          resizeObserver.observe(appRoot);
        } catch {
          // Ignore
        }
      }

      // Initialize Bridge Handshake
      async function initializeBridge() {
        try {
          const initRes = await sendRpcRequest('ui/initialize', {
            protocolVersion: '2026-01-26',
            appInfo: {
              name: 'agy-usage-panel',
              version: '1.2.0'
            },
            appCapabilities: {}
          }, 15000);

          if (disposed) return;

          if (initRes && initRes.hostContext && initRes.hostContext.theme) {
            applyTheme(initRes.hostContext.theme);
          }

          sendRpcNotification('ui/notifications/initialized', {});
          isInitialized = true;

          startCountdowns();
          loadUsage(false);
          startPolling();
        } catch (err) {
          if (disposed) return;
          if (err?.code === 'TIMEOUT' || err?.rpcMethod) {
            const m = err.rpcMethod || 'ui/initialize';
            const ms = err.timeoutMs || 15000;
            showError({
              type: 'host_init_timeout',
              method: m,
              timeoutMs: ms,
              format: (dict) => `${dict.errHostConnect}${dict.errTimeout(m, ms)}`
            });
          } else if (err?.code === 'NOT_IN_IFRAME' || err?.message === I18N['zh-CN'].errNotInIframe || err?.message === I18N['en'].errNotInIframe) {
            showError({
              type: 'host_init_not_in_iframe',
              format: (dict) => `${dict.errHostConnect}${dict.errNotInIframe}`
            });
          } else if (!err?.message || err?.message === I18N['zh-CN'].errHostTimeout || err?.message === I18N['en'].errHostTimeout) {
            showError({
              type: 'host_init_fallback',
              format: (dict) => `${dict.errHostConnect}${dict.errHostTimeout}`
            });
          } else {
            const rawMsg = err.message;
            showError({
              type: 'host_init_raw',
              detail: rawMsg,
              format: (dict) => `${dict.errHostConnect}${rawMsg}`
            });
          }
        }
      }

      // Bootstrap language before bridge
      currentLang = resolveInitialLanguage();
      setLanguage(currentLang);

      initializeBridge();
    })();
  </script>
</body>
</html>
