<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGY 用量面板</title>
  <style>
    :root {
      color-scheme: dark;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --bg-canvas: #191a1b;
      --bg-surface: #212224;
      --bg-surface-elevated: #282a2c;
      --bg-surface-hover: #303234;
      --border-subtle: #343638;
      --border-strong: #4c4e50;
      --text-primary: #f0efe9;
      --text-secondary: #b8bab5;
      --text-muted: #93968f;
      --accent: #c9b797;
      --accent-subtle: #2d2b26;
      --positive: #a6b5a2;
      --positive-subtle: #293029;
      --alert-amber: #d4b07a;
      --alert-amber-subtle: #302b23;
      --alert-terracotta: #e2a096;
      --alert-terracotta-subtle: #342724;
      --track-bg: #343638;
      --focus-ring: #c9b797;
      --radius-md: 16px;
      --surface-edge: rgba(255, 255, 255, .035);
      --transition-fast: 140ms cubic-bezier(.2, .8, .2, 1);
    }

    html[data-theme="light"], body[data-theme="light"] {
      color-scheme: light;
      --bg-canvas: #f6f5f1;
      --bg-surface: #fffefb;
      --bg-surface-elevated: #eeede7;
      --bg-surface-hover: #e7e5dd;
      --border-subtle: #e1dfd6;
      --border-strong: #c4c1b5;
      --text-primary: #292c28;
      --text-secondary: #5e625a;
      --text-muted: #686d61;
      --accent: #80663d;
      --accent-subtle: #f2ece0;
      --positive: #51664b;
      --positive-subtle: #ecf0e8;
      --alert-amber: #886321;
      --alert-amber-subtle: #f5eddd;
      --alert-terracotta: #a24e41;
      --alert-terracotta-subtle: #f8eae6;
      --track-bg: #e9e7df;
      --focus-ring: #80663d;
      --surface-edge: rgba(255, 255, 255, .7);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
    body {
      background: var(--bg-canvas);
      color: var(--text-primary);
      font: 13px/1.5 var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      width: 100%; min-width: 0;
      padding: 24px;
    }
    button, select, input { font: inherit; }
    button, select { -webkit-tap-highlight-color: transparent; }
    .app-root {
      display: flex; flex-direction: column; gap: 20px;
      max-width: 1120px; min-width: 0; width: 100%; margin: 0 auto;
    }

    /* A quiet masthead and a compact, separate control row on small panels. */
    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 20px; min-width: 0; padding: 0 2px 2px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      display: grid; place-items: center; width: 38px; height: 38px; flex: none;
      border: 1px solid var(--border-strong); border-radius: 12px;
      color: var(--accent); background: var(--bg-surface);
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .header-identity { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .brand-title {
      display: flex; align-items: baseline; flex-wrap: wrap; gap: 7px;
      font-size: 17px; font-weight: 600; letter-spacing: -.035em; line-height: 1.3;
    }
    .brand-accent { color: var(--border-strong); font-weight: 400; }
    #brand-title-text { font-size: 14px; font-weight: 500; letter-spacing: -.015em; }
    .header-status-group { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--text-muted); font-size: 11px; font-weight: 400; line-height: 1.5;
    }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; flex: none; background: currentColor; }
    .badge-ready .badge-dot { background: var(--positive); }
    .badge-refreshing, .badge-stale { color: var(--alert-amber); }
    .badge-error { color: var(--alert-terracotta); }
    .header-controls { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .control-cluster { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; min-height: 34px; padding: 0 10px; border: 1px solid var(--border-subtle); border-radius: 9px; background: var(--bg-surface); }
    .lang-select {
      color: var(--text-secondary); background: transparent;
      border: 0; border-radius: 4px;
      min-height: 32px; max-width: 114px; min-width: 0; padding: 4px 2px;
      font-size: 11px; cursor: pointer;
    }
    .toggle-wrap {
      display: inline-flex; align-items: center; gap: 7px;
      color: var(--text-secondary); font-size: 11px; cursor: pointer; user-select: none;
      white-space: nowrap; min-height: 32px; padding-left: 12px; border-left: 1px solid var(--border-subtle);
    }
    .toggle-wrap input[type="checkbox"] {
      appearance: none; -webkit-appearance: none; position: relative; flex: none;
      width: 26px; height: 16px; border: 1px solid var(--border-strong);
      border-radius: 99px; background: var(--bg-surface-elevated); cursor: pointer;
    }
    .toggle-wrap input[type="checkbox"]::before {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted);
      transition: transform var(--transition-fast);
    }
    .toggle-wrap input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
    .toggle-wrap input[type="checkbox"]:checked::before { background: var(--bg-canvas); transform: translateX(10px); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 34px; min-width: 11.4em; padding: 5px 11px; border-radius: 9px;
      border: 1px solid var(--border-strong); background: var(--bg-surface-elevated);
      color: var(--text-primary); font-size: 11px; font-weight: 500;
      cursor: pointer; white-space: nowrap;
      transition: background-color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
    }
    .btn:active:not(:disabled):not(:focus-visible) { transform: scale(.97); }
    .btn:focus-visible { transition: none; }
    .btn:disabled { color: var(--text-muted); cursor: not-allowed; }
    .btn-icon { display: block; width: 13px; height: 13px; flex: none; }
    @media (hover: hover) and (pointer: fine) {
      .btn:hover:not(:disabled) { background: var(--bg-surface-hover); border-color: var(--border-strong); }
      .lang-select:hover { color: var(--text-primary); }
      .banner-close:hover { background: var(--alert-terracotta-subtle); }
      .tasks-table tbody tr:hover { background: var(--bg-surface-elevated); }
    }

    .banner {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: 10px; font-size: 12px; overflow-wrap: anywhere;
      border: 1px solid var(--border-subtle);
    }
    .banner-error { background: var(--alert-terracotta-subtle); color: var(--alert-terracotta); }
    .banner-stale { background: var(--alert-amber-subtle); color: var(--alert-amber); }
    .banner-close {
      flex: none; display: grid; place-items: center; width: 26px; height: 26px;
      border: none; border-radius: 6px; background: transparent; color: inherit; font-size: 18px; cursor: pointer;
    }

    /* The quota, rather than the surrounding chrome, carries the visual weight. */
    .quota-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; min-width: 0; }
    .card {
      display: flex; flex-direction: column; gap: 24px; min-width: 0;
      border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
      background: var(--bg-surface); padding: 22px; container-type: inline-size; box-shadow: inset 0 1px 0 var(--surface-edge);
    }
    .card-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; min-width: 0; }
    .card-title-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .group-symbol { color: var(--accent); display: grid; place-items: center; flex: none; width: 22px; height: 22px; }
    .group-symbol svg { width: 20px; height: 20px; }
    .card-title { font-size: 14px; font-weight: 550; letter-spacing: -.02em; overflow-wrap: anywhere; }
    .card-subtitle { color: var(--text-muted); font-size: 10px; white-space: nowrap; margin-left: auto; }
    .quota-items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; min-width: 0; }
    .quota-item { display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative; }
    .quota-item:only-child { grid-column: 1 / -1; }
    .quota-item:nth-child(even)::before { content: ""; position: absolute; top: 0; bottom: 0; left: -12px; width: 1px; background: var(--border-subtle); }
    .quota-meta-row { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-width: 0; }
    .window-label { display: block; min-height: 34px; color: var(--text-secondary); font-size: 12px; line-height: 1.4; font-weight: 400; overflow-wrap: anywhere; }
    .percent-group { display: flex; align-items: baseline; min-height: 44px; min-width: 0; }
    .percent-val {
      color: var(--text-primary); font-size: 44px; font-weight: 450;
      font-variant-numeric: tabular-nums; letter-spacing: -.055em; line-height: 1;
    }
    .percent-unit { color: var(--text-muted); font-size: 16px; font-weight: 400; letter-spacing: -.03em; margin-left: 3px; }
    .low-warning-tag { color: var(--alert-terracotta); font-size: 10px; font-weight: 500; line-height: 1.4; }
    .quota-item.is-low .percent-val, .quota-item.is-low .percent-unit { color: var(--alert-terracotta); }
    .progress-track { height: 4px; width: 100%; border-radius: 99px; overflow: hidden; background: var(--track-bg); }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--accent); transition: width 200ms cubic-bezier(.2, .8, .2, 1); }
    .quota-item.is-low .progress-fill { background: var(--alert-terracotta); }
    .quota-sub-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 10.5px; line-height: 1.5; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .quota-sub-meta > span { overflow-wrap: anywhere; }
    .reset-text { display: block; overflow-wrap: anywhere; }
    .countdown-text { color: var(--text-secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
    .countdown-text.is-passed { color: var(--alert-amber); }

    .tasks-section {
      display: flex; flex-direction: column; gap: 16px; min-width: 0;
      padding: 4px 2px 0; container-type: inline-size;
    }
    .tasks-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px 12px; min-width: 0; }
    .tasks-title-wrap { display: flex; align-items: center; gap: 8px; }
    .tasks-title { color: var(--text-primary); font-size: 13px; font-weight: 500; letter-spacing: -.01em; }
    .tasks-count-pill { color: var(--text-muted); background: var(--bg-surface-elevated); border-radius: 5px; padding: 1px 5px; font-size: 10px; font-variant-numeric: tabular-nums; }
    .tasks-note { color: var(--text-muted); font-size: 11px; overflow-wrap: anywhere; }
    .tasks-empty { color: var(--text-muted); text-align: center; padding: 28px 16px; border: 1px dashed var(--border-strong); border-radius: 12px; font-size: 11px; }
    .tasks-table-wrap { max-width: 100%; max-height: 280px; overflow: auto; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--bg-surface); scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
    .tasks-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 11px; font-variant-numeric: tabular-nums; }
    .tasks-table th { position: sticky; top: 0; z-index: 1; padding: 10px 14px; background: var(--bg-surface); color: var(--text-muted); border-bottom: 1px solid var(--border-subtle); font-size: 10px; font-weight: 400; white-space: nowrap; }
    .tasks-table td { padding: 11px 14px; color: var(--text-secondary); border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
    .tasks-table th:nth-child(4), .tasks-table .task-usage, .tasks-table th:last-child, .tasks-table td:last-child { text-align: right; }
    .tasks-table tr:last-child td { border-bottom: none; }
    .task-id { display: block; max-width: 200px; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); font-size: 11px; line-height: 1.55; color: var(--text-primary); }
    .task-model { font-size: 10.5px; }
    .status-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; line-height: 1.4; color: var(--text-muted); }
    .status-tag::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: currentColor; flex: none; }
    .status-tag.running { color: var(--accent); }
    .status-tag.completed { color: var(--positive); }
    .status-tag.failed { color: var(--alert-terracotta); }
    .status-tag.queued { color: var(--alert-amber); }
    .footer-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px 12px; padding: 12px 2px 0; border-top: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    @container (max-width: 600px) {
      .tasks-table-wrap { max-height: none; overflow: hidden; }
      .tasks-table, .tasks-table tbody { display: block; }
      .tasks-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .tasks-table tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; padding: 13px 15px; border-bottom: 1px solid var(--border-subtle); }
      .tasks-table tr:last-child { border-bottom: 0; }
      .tasks-table td { border: 0; padding: 0; min-width: 0; white-space: normal; overflow-wrap: anywhere; }
      .tasks-table td:nth-child(1) { grid-column: 1 / -1; grid-row: 1; align-self: start; padding-right: 65px; }
      .tasks-table td:nth-child(2) { grid-column: 1 / -1; grid-row: 2; color: var(--text-muted); }
      .tasks-table td:nth-child(3) { grid-column: 2; grid-row: 1; justify-self: end; align-self: start; text-align: right; }
      .tasks-table td:nth-child(4) { grid-column: 1; grid-row: 3; padding-top: 6px; font-size: 11px; text-align: left; }
      .tasks-table td:nth-child(5) { grid-column: 2; grid-row: 3; padding-top: 6px; text-align: right; font-size: 10px; }
      .tasks-table td:nth-child(4)::before, .tasks-table td:nth-child(5)::before { content: attr(data-label); display: block; color: var(--text-muted); font-size: 10px; margin-bottom: 2px; }
      .task-id { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; max-width: none; white-space: normal; overflow-wrap: anywhere; }
    }
    @container (max-width: 280px) {
      .card-header { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 10px; }
      .card-title-wrap { display: contents; }
      .group-symbol { grid-column: 1; grid-row: 1 / 3; }
      .card-title, .card-subtitle { grid-column: 2; }
      .card-subtitle { margin-left: 0; }
    }
    @media (max-width: 720px) {
      body { padding: 20px 16px; }
      .app-root { gap: 18px; }
      .panel-header { gap: 17px; }
      .header-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; width: 100%; gap: 8px; }
    }
    @media (max-width: 480px) {
      body { padding: 18px 12px; }
      .app-root { gap: 16px; }
      .quota-grid { grid-template-columns: 1fr; gap: 12px; }
      .card { padding: 20px 18px; gap: 22px; }
      .quota-items { gap: 18px; }
      .quota-item:nth-child(even)::before { left: -9px; }
      .lang-select { max-width: 114px; min-width: 0; }
      .control-cluster { gap: 8px; padding-inline: 8px; }
      .toggle-wrap { padding-left: 8px; }
      .lang-select, .btn, .toggle-wrap { font-size: 10px; }
      .btn { padding-inline: 7px; }
      .tasks-note { width: 100%; }
    }
    @media (max-width: 360px) {
      .header-controls .btn { position: relative; width: 34px; min-width: 34px; padding: 0; }
      #refresh-btn-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
    @media (forced-colors: active) {
      .toggle-wrap input[type="checkbox"] { appearance: auto; -webkit-appearance: auto; width: 16px; height: 16px; accent-color: auto; }
      .toggle-wrap input[type="checkbox"]::before { display: none; }
    }
  </style>
</head>
<body>
  <div id="app-root" class="app-root">
    <!-- Header -->
    <header class="panel-header">
      <div class="header-left">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 17.5 12 4l8 13.5M7.5 12h9M8 20h8"/>
          </svg>
        </div>
        <div class="header-identity">
        <div class="brand-title">
          <span>AGY</span><span class="brand-accent">/</span><span id="brand-title-text">用量监控</span>
        </div>
        <div class="header-status-group">
          <div id="conn-badge" class="badge badge-ready" role="status">
            <span class="badge-dot"></span>
            <span id="conn-text">准备连接...</span>
          </div>
          <div id="stale-badge" class="badge badge-stale hidden">数据已过期 (>120s)</div>
        </div>
        </div>
      </div>
      <div class="header-controls">
        <div class="control-cluster">
        <select id="lang-select" class="lang-select" aria-label="选择语言">
          <option id="lang-auto" value="auto">跟随 Codex</option>
          <option value="zh-CN">中文</option>
          <option value="en">English</option>
        </select>
        <label class="toggle-wrap" id="auto-refresh-label" title="每5秒自动拉取缓存数据">
          <input type="checkbox" id="auto-refresh-toggle" checked>
          <span id="auto-refresh-text">自动同步</span>
        </label>
        </div>
        <button id="refresh-btn" class="btn" title="立即发起配额刷新 (10秒冷却)">
          <svg class="btn-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 7a6.5 6.5 0 1 0 .1 5M16 3v4h-4"/></svg>
          <span id="refresh-btn-text">立即刷新</span>
        </button>
      </div>
    </header>

    <!-- Error Banner -->
    <div id="error-banner" class="banner banner-error hidden" role="alert">
      <span id="error-message">执行异常</span>
      <button id="error-dismiss" class="banner-close" title="关闭">&times;</button>
    </div>

    <!-- Quota Grid -->
    <main id="quota-grid" class="quota-grid">
      <div class="card" style="text-align: center; color: var(--text-muted); padding: 30px;">
        <p id="quota-loading-text">正在读取配额...</p>
      </div>
    </main>

    <!-- Tasks Section -->
    <section class="tasks-section" aria-labelledby="tasks-title">
      <div class="tasks-header">
        <div class="tasks-title-wrap">
          <h2 id="tasks-title" class="tasks-title">Supervisor 任务记录</h2>
          <span id="tasks-count" class="tasks-count-pill">0</span>
        </div>
        <span id="tasks-note" class="tasks-note">显式上报的任务记录</span>
      </div>
      <div id="tasks-empty" class="tasks-empty">
        暂无显式上报的任务事件
      </div>
      <div id="tasks-table-wrap" class="tasks-table-wrap hidden" tabindex="0" role="region" aria-labelledby="tasks-title">
        <table class="tasks-table">
          <thead>
            <tr>
              <th id="th-task-id" scope="col">任务 ID</th>
              <th id="th-model" scope="col">模型</th>
              <th id="th-status" scope="col">状态</th>
              <th id="th-tokens" scope="col">Token (入 / 出)</th>
              <th id="th-time" scope="col">上报时间 (CST)</th>
            </tr>
          </thead>
          <tbody id="tasks-body"></tbody>
        </table>
      </div>
    </section>

    <!-- Footer Meta -->
    <footer class="footer-meta">
      <span id="updated-at-text">更新时间: -</span>
      <span id="footer-note">定时采集 · 北京时间 (CST)</span>
    </footer>
  </div>

  <script>
    (function () {
      'use strict';

      // Elements
      const connBadge = document.getElementById('conn-badge');
      const connText = document.getElementById('conn-text');
      const staleBadge = document.getElementById('stale-badge');
      const refreshBtn = document.getElementById('refresh-btn');
      const refreshBtnText = document.getElementById('refresh-btn-text');
      const autoRefreshToggle = document.getElementById('auto-refresh-toggle');
      const errorBanner = document.getElementById('error-banner');
      const errorMessage = document.getElementById('error-message');
      const errorDismiss = document.getElementById('error-dismiss');
      const quotaGrid = document.getElementById('quota-grid');
      const tasksCount = document.getElementById('tasks-count');
      const tasksEmpty = document.getElementById('tasks-empty');
      const tasksTableWrap = document.getElementById('tasks-table-wrap');
      const tasksBody = document.getElementById('tasks-body');
      const updatedAtText = document.getElementById('updated-at-text');
      const appRoot = document.getElementById('app-root');
      const langSelect = document.getElementById('lang-select');

      // State
      let isInitialized = false;
      let disposed = false;
      let inFlight = false;
      let nextRpcId = 1;
      const pendingRequests = new Map();
      let pollTimer = null;
      let cooldownTimer = null;
      let cooldownSeconds = 0;
      let countdownTimer = null;
      let lastReportedWidth = 0;
      let lastReportedHeight = 0;
      let resizeDebounce = null;
      let resizeObserver = null;
      let lastKnownStatus = null;
      let currentLang = 'zh-CN';
      let languagePreference = 'auto';
      let hostLanguage = null;

      const STORAGE_KEY = 'agy_quota_lang';

      // Defensive localStorage access
      function getStorage() {
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            const testKey = '__agy_storage_test__';
            window.localStorage.setItem(testKey, '1');
            window.localStorage.removeItem(testKey);
            return window.localStorage;
          }
        } catch {
          // Sandbox or security denied
        }
        return null;
      }

      function normalizeLang(lang) {
        if (!lang || typeof lang !== 'string') return null;
        const l = lang.trim().toLowerCase();
        if (l.startsWith('zh')) return 'zh-CN';
        if (l.startsWith('en')) return 'en';
        return null;
      }

      function resolveInitialLanguage() {
        const storage = getStorage();
        if (storage) {
          try {
            const saved = storage.getItem(STORAGE_KEY);
            languagePreference = normalizeLang(saved) || 'auto';
          } catch {
            // Keep automatic mode when storage is unavailable.
          }
        }
        return languagePreference === 'auto' ? resolveBrowserLanguage() : languagePreference;
      }

      function languageFromHostLocale(locale) {
        if (typeof locale !== 'string') return null;
        try {
          const canonical = Intl.getCanonicalLocales(locale.trim())[0];
          return canonical ? (canonical.toLowerCase().startsWith('zh') ? 'zh-CN' : 'en') : null;
        } catch {
          return null;
        }
      }

      function applyHostContext(context) {
        if (!context || typeof context !== 'object') return;
        if (context.theme) applyTheme(context.theme);
        if (Object.prototype.hasOwnProperty.call(context, 'locale')) {
          hostLanguage = languageFromHostLocale(context.locale);
          if (languagePreference === 'auto') setLanguage('auto', false);
        }
      }

      function resolveBrowserLanguage() {
        // 2. Navigator language(s) (zh=>zh-CN, others English, missing defaults Chinese)
        try {
          let nav = null;
          if (typeof window !== 'undefined' && window.navigator) {
            nav = window.navigator;
          } else if (typeof navigator !== 'undefined') {
            nav = navigator;
          }
          if (nav) {
            let primary = null;
            if (Array.isArray(nav.languages) && nav.languages.length > 0) {
              primary = nav.languages.find(l => typeof l === 'string' && l.trim().length > 0);
            } else if (typeof nav.language === 'string' && nav.language.trim().length > 0) {
              primary = nav.language;
            }
            if (primary) {
              const lower = primary.trim().toLowerCase();
              if (lower.startsWith('zh')) return 'zh-CN';
              return 'en';
            }
          }
        } catch {
          // Ignore
        }

        // 3. Missing defaults Chinese
        return 'zh-CN';
      }

      function saveLanguagePreference(lang) {
        const storage = getStorage();
        if (storage) {
          try {
            storage.setItem(STORAGE_KEY, lang);
          } catch {
            // Storage quota or denied
          }
        }
      }

      // Escape HTML
      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Format ISO string to Asia/Shanghai CST (UTC+8 in English)
      function formatShanghaiTime(isoString, lang = currentLang) {
        if (!isoString) return '-';
        try {
          const d = new Date(isoString);
          if (isNaN(d.getTime())) return String(isoString);
          const isEn = lang === 'en';
          const locale = isEn ? 'en-US' : 'zh-CN';
          const suffix = isEn ? ' UTC+8' : ' CST';
          return new Intl.DateTimeFormat(locale, {
            timeZone: 'Asia/Shanghai',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
          }).format(d) + suffix;
        } catch {
          return String(isoString);
        }
      }

      // Compact dates keep quota columns readable; the complete time remains in the title.
      function formatCompactShanghaiTime(isoString, lang = currentLang) {
        if (!isoString) return '-';
        try {
          const d = new Date(isoString);
          if (isNaN(d.getTime())) return String(isoString);
          return new Intl.DateTimeFormat(lang === 'en' ? 'en-US' : 'zh-CN', {
            timeZone: 'Asia/Shanghai',
            month: lang === 'en' ? 'short' : '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
          }).format(d);
        } catch {
          return String(isoString);
        }
      }

      // Complete descriptions are retained for tooltips and assistive technology.
      function getCountdownInfo(isoString, lang = currentLang) {
        const dict = I18N[lang] || I18N['zh-CN'];
        if (!isoString) return { text: '-', compactText: '-', isPassed: false };
        const diffMs = new Date(isoString).getTime() - Date.now();
        if (diffMs <= 0) {
          return { text: dict.countdownExpired, compactText: dict.countdownExpired, isPassed: true };
        }
        const totalSeconds = Math.floor(diffMs / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = totalSeconds % 60;

        if (hours >= 24) {
          const days = Math.floor(hours / 24);
          const remHours = hours % 24;
          return { text: dict.countdownDays(days, remHours, mins), compactText: dict.compactDays(days, remHours), isPassed: false };
        }
        const compactText = hours > 0 ? dict.compactHours(hours, mins) : mins > 0 ? dict.compactMinutes(mins, secs) : dict.compactSeconds(secs);
        return { text: dict.countdownHours(hours, mins, secs), compactText, isPassed: false };
      }

      function formatWindowLabel(name, lang = currentLang) {
        if (!name) return '';
        const lower = name.toLowerCase();
        const dict = I18N[lang] || I18N['zh-CN'];
        if (lower.includes('weekly') && lower.includes('remaining')) return dict.windowWeeklyRemaining;
        if ((lower.includes('five hour') || lower.includes('5-hour') || lower.includes('5 hour')) && lower.includes('remaining')) return dict.windowFiveHourRemaining;
        if (lower.includes('weekly')) return dict.windowWeekly;
        if (lower.includes('five hour') || lower.includes('5-hour') || lower.includes('5 hour')) return dict.windowFiveHour;
        return name;
      }

      function formatGroupLabel(name, lang = currentLang) {
        const dict = I18N[lang] || I18N['zh-CN'];
        if (!name) return dict.quotaGeneralGroup;
        const lower = name.toLowerCase();
        if (lower.includes('gemini')) return dict.quotaGeminiGroup;
        if (lower.includes('claude') || lower.includes('gpt')) return dict.quotaClaudeGptGroup;
        return name;
      }

      // Apply theme
      function applyTheme(theme) {
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.body.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.body.setAttribute('data-theme', 'dark');
        }
      }

      // Detect system theme preference initially
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        applyTheme('light');
      }

      // Update manual refresh button UI state
      function updateRefreshBtnUI() {
        if (disposed) return;
        const dict = I18N[currentLang] || I18N['zh-CN'];
        if (inFlight) {
          refreshBtn.disabled = true;
          refreshBtnText.textContent = dict.refreshing;
        } else if (cooldownSeconds > 0) {
          refreshBtn.disabled = true;
          refreshBtnText.textContent = dict.cooldown(cooldownSeconds);
        } else {
          refreshBtn.disabled = false;
          refreshBtnText.textContent = dict.refreshNow;
        }
      }

      // Set language & update UI immediately
      function setLanguage(lang, persist = true) {
        if (disposed) return;
        if (!['auto', 'zh-CN', 'en'].includes(lang)) return;
        languagePreference = lang;
        currentLang = lang === 'auto' ? (hostLanguage || resolveBrowserLanguage()) : lang;
        if (persist) saveLanguagePreference(lang);

        const dict = I18N[currentLang] || I18N['zh-CN'];
        if (document.documentElement) {
          document.documentElement.lang = currentLang;
          if (typeof document.documentElement.setAttribute === 'function') {
            document.documentElement.setAttribute('lang', currentLang);
          }
        }
        document.title = dict.docTitle;

        if (langSelect) {
          if (langSelect.value !== languagePreference) {
            langSelect.value = languagePreference;
          }
          if (typeof langSelect.setAttribute === 'function') {
            langSelect.setAttribute('aria-label', dict.langSelectLabel);
            langSelect.title = languagePreference === 'auto' && !hostLanguage ? dict.hostFallback : dict.langSelectLabel;
          }
        }

        const autoOption = document.getElementById('lang-auto');
        if (autoOption) autoOption.textContent = dict.followHost;

        // Update static DOM elements if present
        const brandEl = document.getElementById('brand-title-text');
        if (brandEl) brandEl.textContent = dict.brandTitle;

        const autoRefLabel = document.getElementById('auto-refresh-label');
        if (autoRefLabel) autoRefLabel.title = dict.autoSyncTitle;

        const autoRefText = document.getElementById('auto-refresh-text');
        if (autoRefText) autoRefText.textContent = dict.autoSync;

        if (refreshBtn) refreshBtn.title = dict.refreshBtnTitle;
        if (errorDismiss) {
          errorDismiss.title = dict.errorClose;
          if (typeof errorDismiss.setAttribute === 'function') {
            errorDismiss.setAttribute('aria-label', dict.errorClose);
          }
        }

        const staleEl = document.getElementById('stale-badge');
        if (staleEl) staleEl.textContent = dict.staleBadge;

        const quotaLoadingEl = document.getElementById('quota-loading-text');
        if (quotaLoadingEl) quotaLoadingEl.textContent = dict.quotaLoading;

        const tasksTitleEl = document.getElementById('tasks-title');
        if (tasksTitleEl) tasksTitleEl.textContent = dict.tasksTitle;

        const tasksNoteEl = document.getElementById('tasks-note');
        if (tasksNoteEl) tasksNoteEl.textContent = dict.tasksNote;

        const tasksEmptyEl = document.getElementById('tasks-empty');
        if (tasksEmptyEl) tasksEmptyEl.textContent = dict.tasksEmpty;

        const thTaskId = document.getElementById('th-task-id');
        if (thTaskId) thTaskId.textContent = dict.thTaskId;

        const thModel = document.getElementById('th-model');
        if (thModel) thModel.textContent = dict.thModel;

        const thStatus = document.getElementById('th-status');
        if (thStatus) thStatus.textContent = dict.thStatus;

        const thTokens = document.getElementById('th-tokens');
        if (thTokens) thTokens.textContent = dict.thTokens;

        const thTime = document.getElementById('th-time');
        if (thTime) thTime.textContent = dict.thTime;

        const footerNoteEl = document.getElementById('footer-note');
        if (footerNoteEl) footerNoteEl.textContent = dict.footerNote;

        // Re-render button state (refreshing / cooldown / ready)
        updateRefreshBtnUI();

        // Re-render status if cached (without clearing active errors)
        if (lastKnownStatus) {
          renderStatus(lastKnownStatus, false);
        } else {
          // If no status yet, update initial connection badge text
          connText.textContent = dict.connConnecting;
          updatedAtText.textContent = dict.updatedAtPrefix + '-';
        }

        // Re-render error banner (translates prefix/fallback, preserves visibility and dismissed state)
        renderError();

        notifySize();
      }

      // Send JSON-RPC request to parent
      function sendRpcRequest(method, params, timeoutMs = 20000) {
        if (disposed) {
          const err = new Error('UI resource disposed');
          err.code = 'DISPOSED';
          return Promise.reject(err);
        }
        if (window.parent === window) {
          const dict = I18N[currentLang] || I18N['zh-CN'];
          const err = new Error(dict.errNotInIframe);
          err.code = 'NOT_IN_IFRAME';
          return Promise.reject(err);
        }
        const id = nextRpcId++;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pendingRequests.delete(id);
            const dict = I18N[currentLang] || I18N['zh-CN'];
            const err = new Error(dict.errTimeout(method, timeoutMs));
            err.code = 'TIMEOUT';
            err.rpcMethod = method;
            err.timeoutMs = timeoutMs;
            reject(err);
          }, timeoutMs);

          pendingRequests.set(id, { resolve, reject, timer });
          window.parent.postMessage({
            jsonrpc: '2.0',
            id,
            method,
            params
          }, '*');
        });
      }

      // Send JSON-RPC notification to parent
      function sendRpcNotification(method, params = {}) {
        if (disposed) return;
        if (window.parent === window) return;
        window.parent.postMessage({
          jsonrpc: '2.0',
          method,
          params
        }, '*');
      }

      // Notify parent of layout size changes
      function notifySize() {
        if (!isInitialized || disposed) return;
        if (resizeDebounce) clearTimeout(resizeDebounce);
        resizeDebounce = setTimeout(() => {
          resizeDebounce = null;
          if (!isInitialized || disposed) return;

          const docEl = document.documentElement;
          const body = document.body;
          // Use actual viewport width to prevent host width shrink loop
          const w = Math.ceil((docEl && docEl.clientWidth) || window.innerWidth || (appRoot ? appRoot.offsetWidth : 320));
          // Height includes body padding (12px top + 12px bottom = 24px)
          const rootScrollHeight = appRoot ? (appRoot.scrollHeight + 24) : 0;
          const docScrollHeight = docEl ? docEl.scrollHeight : 0;
          const bodyScrollHeight = body ? body.scrollHeight : 0;
          const h = Math.ceil(Math.max(rootScrollHeight, docScrollHeight, bodyScrollHeight, 300));

          if (Math.abs(h - lastReportedHeight) >= 4 || Math.abs(w - lastReportedWidth) >= 4) {
            lastReportedWidth = w;
            lastReportedHeight = h;
            sendRpcNotification('ui/notifications/size-changed', { width: w, height: h });
          }
        }, 100);
      }

      let currentError = null;
      let isErrorVisible = false;

      // Show/Hide error banner
      function showError(desc) {
        if (disposed) return;
        if (!desc) {
          clearError();
          return;
        }
        const descriptor = (typeof desc === 'string')
          ? { type: 'raw', detail: desc, format: () => desc }
          : desc;
        currentError = descriptor;
        isErrorVisible = true;
        renderError();
      }

      function hideError() {
        if (disposed) return;
        isErrorVisible = false;
        if (errorBanner) {
          errorBanner.classList.add('hidden');
        }
        notifySize();
      }

      function clearError() {
        if (disposed) return;
        currentError = null;
        isErrorVisible = false;
        if (errorBanner) {
          errorBanner.classList.add('hidden');
        }
        notifySize();
      }

      function renderError() {
        if (disposed || !errorBanner || !errorMessage) return;
        if (!isErrorVisible || !currentError) {
          errorBanner.classList.add('hidden');
          return;
        }
        const dict = I18N[currentLang] || I18N['zh-CN'];
        const text = typeof currentError.format === 'function'
          ? currentError.format(dict)
          : (currentError.detail || '');
        errorMessage.textContent = text;
        errorBanner.classList.remove('hidden');
        notifySize();
      }

      errorDismiss.addEventListener('click', hideError);

      // Render Status Data
      function renderStatus(status, isNewStatus = true) {
        if (disposed || !status) return;
        lastKnownStatus = status;
        const dict = I18N[currentLang] || I18N['zh-CN'];

        // Only update connection error state if newly arrived status from host
        if (isNewStatus) {
          const connErr = status.connection?.error;
          if (connErr) {
            const errText = typeof connErr === 'string'
              ? connErr
              : (connErr.message || JSON.stringify(connErr));
            showError({
              type: 'connection_error',
              detail: errText,
              format: () => errText
            });
          } else {
            clearError();
          }
        }

        // 1. Connection state badge
        const connState = status.connection?.state || 'ready';
        connBadge.className = 'badge';
        if (connState === 'ready') {
          connBadge.classList.add('badge-ready');
          connText.textContent = dict.connReady;
        } else if (connState === 'refreshing') {
          connBadge.classList.add('badge-refreshing');
          connText.textContent = dict.connRefreshing;
        } else if (connState === 'error') {
          connBadge.classList.add('badge-error');
          connText.textContent = dict.connError;
        } else {
          connBadge.classList.add('badge-ready');
          connText.textContent = connState;
        }

        // 2. Freshness & Stale (locally > 120s or server reported)
        const updatedAt = status.usage?.updatedAt;
        updatedAtText.textContent = `${dict.updatedAtPrefix}${formatShanghaiTime(updatedAt, currentLang)}`;
        const isServerStale = !!status.usage?.stale;
        const isLocallyStale = updatedAt ? (Date.now() - new Date(updatedAt).getTime() > 120000) : false;

        if (isServerStale || isLocallyStale) {
          staleBadge.textContent = dict.staleBadge;
          staleBadge.classList.remove('hidden');
        } else {
          staleBadge.classList.add('hidden');
        }

        // 3. Render Quota Windows
        const windows = status.usage?.windows || [];
        if (windows.length === 0) {
          quotaGrid.innerHTML = `
            <div class="card" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 30px;">
              <p>${escapeHtml(dict.quotaEmpty)}</p>
            </div>
          `;
        } else {
          // Group by model group
          const groups = new Map();
          for (const win of windows) {
            const g = win.group || '通用模型';
            if (!groups.has(g)) groups.set(g, []);
            groups.get(g).push(win);
          }

          let gridHtml = '';
          for (const [groupName, winList] of groups.entries()) {
            let itemsHtml = '';
            for (const win of winList) {
              const rawPercent = (typeof win.remainingPercent === 'number') ? win.remainingPercent : 0;
              const percent = Math.max(0, Math.min(100, rawPercent));
              const isLow = percent <= 20;
              const countdown = getCountdownInfo(win.resetsAt, currentLang);
              const resetCst = formatShanghaiTime(win.resetsAt, currentLang);
              const label = formatWindowLabel(win.window, currentLang);

              itemsHtml += `
                <div class="quota-item ${isLow ? 'is-low' : ''}" data-resets-at="${escapeHtml(win.resetsAt || '')}">
                  <div class="quota-meta-row">
                    <span class="window-label">${escapeHtml(label)}</span>
                    <div class="percent-group">
                      <span class="percent-val">${percent}<span class="percent-unit">%</span></span>
                    </div>
                  </div>
                  <div class="progress-track" role="progressbar" aria-label="${escapeHtml(dict.progressAriaLabel(label, percent))}" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-fill" style="width: ${percent}%;"></div>
                  </div>
                  <div class="quota-sub-meta">
                    <span class="countdown-text ${countdown.isPassed ? 'is-passed' : ''}" title="${escapeHtml(countdown.text)}" aria-label="${escapeHtml(countdown.text)}">${escapeHtml(countdown.compactText)}</span>
                    <time class="reset-text" datetime="${escapeHtml(win.resetsAt || '')}" title="${escapeHtml(resetCst)}" aria-label="${escapeHtml(dict.resetPrefix + resetCst)}">${escapeHtml(dict.resetPrefix)}${escapeHtml(formatCompactShanghaiTime(win.resetsAt, currentLang))}</time>
                    ${isLow ? `<span class="low-warning-tag">${escapeHtml(dict.lowAllowanceTag)}</span>` : ''}
                  </div>
                </div>
              `;
            }

            gridHtml += `
              <div class="card">
                <div class="card-header">
                  <div class="card-title-wrap">
                    <span class="group-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"><path d="M12 2c0 6-4 10-10 10 6 0 10 4 10 10 0-6 4-10 10-10-6 0-10-4-10-10Z"/></svg></span>
                    <h2 class="card-title">${escapeHtml(formatGroupLabel(groupName, currentLang))}</h2>
                  </div>
                  <span class="card-subtitle">${escapeHtml(dict.quotaWindowsCount(winList.length))}</span>
                </div>
                <div class="quota-items">
                  ${itemsHtml}
                </div>
              </div>
            `;
          }
          quotaGrid.innerHTML = gridHtml;
        }

        // 4. Render Tasks
        const tasks = Array.isArray(status.tasks) ? status.tasks : [];
        tasksCount.textContent = String(tasks.length);
        if (tasks.length === 0) {
          tasksEmpty.textContent = dict.tasksEmpty;
          tasksEmpty.classList.remove('hidden');
          tasksTableWrap.classList.add('hidden');
          tasksBody.innerHTML = '';
        } else {
          tasksEmpty.classList.add('hidden');
          tasksTableWrap.classList.remove('hidden');

          const statusMap = {
            queued: dict.statusQueued,
            running: dict.statusRunning,
            completed: dict.statusCompleted,
            failed: dict.statusFailed,
            unknown: dict.statusUnknown
          };

          let rowsHtml = '';
          for (const t of tasks) {
            const statusClass = ['queued', 'running', 'completed', 'failed'].includes(t.status) ? t.status : 'unknown';
            const statusLabel = statusMap[t.status] || t.status;
            const rawUsage = t.usage || {};
            const inputVal = rawUsage.inputTokens !== undefined ? rawUsage.inputTokens : rawUsage.input_tokens;
            const outputVal = rawUsage.outputTokens !== undefined ? rawUsage.outputTokens : rawUsage.output_tokens;
            const hasInput = (inputVal !== undefined && inputVal !== null);
            const hasOutput = (outputVal !== undefined && outputVal !== null);

            let usageText = dict.tokensMissing;
            if (hasInput || hasOutput) {
              const inp = hasInput ? Number(inputVal).toLocaleString() : dict.tokensMissing;
              const out = hasOutput ? Number(outputVal).toLocaleString() : dict.tokensMissing;
              usageText = `${inp} / ${out}`;
            }
            const reportedAt = t.createdAt || t.updatedAt;

            rowsHtml += `
              <tr>
                <td><span class="task-id" title="${escapeHtml(t.id)}">${escapeHtml(t.id)}</span></td>
                <td class="task-model">${escapeHtml(t.model || '-')}</td>
                <td><span class="status-tag ${statusClass}">${escapeHtml(statusLabel)}</span></td>
                <td class="task-usage" data-label="${escapeHtml(dict.thTokens)}">${escapeHtml(usageText)}</td>
                <td data-label="${escapeHtml(dict.thTime)}"><time datetime="${escapeHtml(reportedAt || '')}" title="${escapeHtml(formatShanghaiTime(reportedAt, currentLang))}" aria-label="${escapeHtml(formatShanghaiTime(reportedAt, currentLang))}">${escapeHtml(formatCompactShanghaiTime(reportedAt, currentLang))}</time></td>
              </tr>
            `;
          }
          tasksBody.innerHTML = rowsHtml;
        }

        notifySize();
      }

      // Fetch usage via tools/call agy_usage_get
      async function loadUsage(forceRefresh = false) {
        if (disposed || !isInitialized || inFlight) return;

        inFlight = true;
        updateRefreshBtnUI();

        try {
          const res = await sendRpcRequest('tools/call', {
            name: 'agy_usage_get',
            arguments: { force_refresh: forceRefresh }
          }, 35000);

          if (disposed) return;

          if (res && res.isError) {
            const rawDetail = res.content?.[0]?.text || null;
            showError({
              type: 'tool_failed',
              detail: rawDetail,
              format: (dict) => rawDetail || dict.errToolFailed
            });
          } else if (res && res.structuredContent) {
            renderStatus(res.structuredContent, true);
          } else if (res && res.content) {
            showError({
              type: 'tool_missing_structured',
              format: (dict) => dict.errToolMissingStructured
            });
          }
        } catch (err) {
          if (disposed) return;
          if (err?.code === 'TIMEOUT' || err?.rpcMethod) {
            const m = err.rpcMethod || 'tools/call';
            const ms = err.timeoutMs || 35000;
            showError({
              type: 'query_timeout',
              method: m,
              timeoutMs: ms,
              format: (dict) => dict.errTimeout(m, ms)
            });
          } else if (err?.code === 'NOT_IN_IFRAME' || err?.message === I18N['zh-CN'].errNotInIframe || err?.message === I18N['en'].errNotInIframe) {
            showError({
              type: 'not_in_iframe',
              format: (dict) => dict.errNotInIframe
            });
          } else if (!err?.message || err.message === I18N['zh-CN'].errQueryFailed || err.message === I18N['en'].errQueryFailed) {
            showError({
              type: 'query_fallback',
              format: (dict) => dict.errQueryFailed
            });
          } else {
            const rawMsg = err.message;
            showError({
              type: 'query_raw',
              detail: rawMsg,
              format: () => rawMsg
            });
          }
        } finally {
          if (!disposed) {
            inFlight = false;
            updateRefreshBtnUI();
          }
        }
      }

      // Polling control
      function startPolling() {
        stopPolling();
        if (disposed || !autoRefreshToggle.checked) return;
        pollTimer = setInterval(() => {
          if (!disposed && !document.hidden && isInitialized && !inFlight) {
            loadUsage(false);
          }
        }, 5000);
      }

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      // Cooldown timer (10s)
      function startCooldown(sec = 10) {
        if (disposed) return;
        cooldownSeconds = sec;
        updateRefreshBtnUI();
        if (cooldownTimer) clearInterval(cooldownTimer);
        cooldownTimer = setInterval(() => {
          cooldownSeconds--;
          if (cooldownSeconds <= 0) {
            clearInterval(cooldownTimer);
            cooldownTimer = null;
            cooldownSeconds = 0;
          }
          updateRefreshBtnUI();
        }, 1000);
      }

      function stopCooldown() {
        if (cooldownTimer) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
        }
        cooldownSeconds = 0;
      }

      // Dynamic countdowns update every second
      function startCountdowns() {
        stopCountdowns();
        if (disposed) return;
        countdownTimer = setInterval(() => {
          if (disposed) return;
          const items = document.querySelectorAll('.quota-item[data-resets-at]');
          if (items && typeof items.forEach === 'function') {
            items.forEach(el => {
              const resetsAt = el.getAttribute ? el.getAttribute('data-resets-at') : null;
              const countdownEl = el.querySelector ? el.querySelector('.countdown-text') : null;
              if (resetsAt && countdownEl) {
                const info = getCountdownInfo(resetsAt, currentLang);
                countdownEl.textContent = info.compactText;
                countdownEl.title = info.text;
                if (typeof countdownEl.setAttribute === 'function') countdownEl.setAttribute('aria-label', info.text);
                if (info.isPassed) {
                  if (countdownEl.classList && countdownEl.classList.add) countdownEl.classList.add('is-passed');
                } else {
                  if (countdownEl.classList && countdownEl.classList.remove) countdownEl.classList.remove('is-passed');
                }
              }
            });
          }

          // Check local staleness
          if (lastKnownStatus && lastKnownStatus.usage?.updatedAt) {
            const isOld = Date.now() - new Date(lastKnownStatus.usage.updatedAt).getTime() > 120000;
            const dict = I18N[currentLang] || I18N['zh-CN'];
            if (isOld || lastKnownStatus.usage.stale) {
              staleBadge.textContent = dict.staleBadge;
              staleBadge.classList.remove('hidden');
            } else {
              staleBadge.classList.add('hidden');
            }
          }
        }, 1000);
      }

      function stopCountdowns() {
        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }
      }

      function stopResizeDebounce() {
        if (resizeDebounce) {
          clearTimeout(resizeDebounce);
          resizeDebounce = null;
        }
      }

      function disconnectResizeObserver() {
        if (resizeObserver) {
          try {
            resizeObserver.disconnect();
          } catch {
            // Ignore
          }
          resizeObserver = null;
        }
      }

      // Perform resource teardown
      function performTeardown() {
        if (disposed) return;
        disposed = true;
        isInitialized = false;
        inFlight = false;

        stopPolling();
        stopCooldown();
        stopCountdowns();
        stopResizeDebounce();
        disconnectResizeObserver();

        for (const [id, req] of pendingRequests.entries()) {
          clearTimeout(req.timer);
          try {
            req.reject(new Error('UI resource disposed'));
          } catch {
            // Ignore
          }
        }
        pendingRequests.clear();
      }

      // Host Message Listener
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const msg = event.data;
        if (!msg || typeof msg !== 'object' || msg.jsonrpc !== '2.0') return;

        // If disposed, ignore any incoming message (ignore late data)
        if (disposed) return;

        // 1. Pending Request Response
        // Only accept response id when method is absent and result/error is present to prevent collision with host requests
        const isResponse = (msg.id !== undefined && !msg.method && (msg.result !== undefined || msg.error !== undefined));
        if (isResponse) {
          if (pendingRequests.has(msg.id)) {
            const { resolve, reject, timer } = pendingRequests.get(msg.id);
            clearTimeout(timer);
            pendingRequests.delete(msg.id);

            if (msg.error) {
              reject(new Error(msg.error.message || `RPC Error ${msg.error.code}`));
            } else {
              resolve(msg.result);
            }
          }
          return;
        }

        // 2. Host Requests & Notifications
        if (msg.method) {
          const method = msg.method;
          const params = msg.params;
          const isRequest = (msg.id !== undefined);

          if (method === 'ui/resource-teardown') {
            performTeardown();
            if (isRequest) {
              window.parent.postMessage({
                jsonrpc: '2.0',
                id: msg.id,
                result: {}
              }, '*');
            }
            return;
          }

          if (method === 'ui/notifications/teardown') {
            performTeardown();
            return;
          }

          if (method === 'ui/notifications/tool-result') {
            // Ext-apps spec passes CallToolResult directly in params, or optionally in params.result
            const toolRes = (params && params.result) ? params.result : params;
            if (toolRes) {
              if (toolRes.isError) {
                const rawDetail = toolRes.content?.[0]?.text || null;
                showError({
                  type: 'tool_call_error',
                  detail: rawDetail,
                  format: (dict) => rawDetail || dict.errToolCallError
                });
              } else if (toolRes.structuredContent) {
                renderStatus(toolRes.structuredContent, true);
              }
            }
            return;
          }

          if (method === 'ui/notifications/tool-cancelled') {
            return;
          }

          if (method === 'ui/notifications/host-context-changed') {
            const ctx = params?.hostContext || params;
            applyHostContext(ctx);
            return;
          }

          // Unknown host request: respond with -32601 Method not found
          if (isRequest) {
            window.parent.postMessage({
              jsonrpc: '2.0',
              id: msg.id,
              error: {
                code: -32601,
                message: `Method not found: ${method}`
              }
            }, '*');
            return;
          }
        }
      });

      // UI Events
      refreshBtn.addEventListener('click', () => {
        if (disposed || inFlight || cooldownSeconds > 0) return;
        startCooldown(10);
        loadUsage(true);
      });

      autoRefreshToggle.addEventListener('change', () => {
        if (disposed) return;
        if (autoRefreshToggle.checked) {
          startPolling();
          loadUsage(false);
        } else {
          stopPolling();
        }
      });

      if (langSelect) {
        langSelect.addEventListener('change', (e) => {
          if (e && e.target && e.target.value) {
            setLanguage(e.target.value);
          }
        });
      }

      // Pause while hidden
      document.addEventListener('visibilitychange', () => {
        if (disposed || !isInitialized) return;
        if (document.hidden) {
          stopPolling();
        } else {
          if (autoRefreshToggle.checked) {
            loadUsage(false);
            startPolling();
          }
        }
      });

      // Observe size changes
      if (window.ResizeObserver && appRoot) {
        try {
          resizeObserver = new ResizeObserver(() => {
            if (isInitialized && !disposed) {
              notifySize();
            }
          });
          resizeObserver.observe(appRoot);
        } catch {
          // Ignore
        }
      }

      // Initialize Bridge Handshake
      async function initializeBridge() {
        try {
          const initRes = await sendRpcRequest('ui/initialize', {
            protocolVersion: '2026-01-26',
            appInfo: {
              name: 'agy-usage-panel',
              version: '1.3.3'
            },
            appCapabilities: {}
          }, 15000);

          if (disposed) return;

          applyHostContext(initRes?.hostContext);

          sendRpcNotification('ui/notifications/initialized', {});
          isInitialized = true;

          startCountdowns();
          loadUsage(false);
          startPolling();
        } catch (err) {
          if (disposed) return;
          if (err?.code === 'TIMEOUT' || err?.rpcMethod) {
            const m = err.rpcMethod || 'ui/initialize';
            const ms = err.timeoutMs || 15000;
            showError({
              type: 'host_init_timeout',
              method: m,
              timeoutMs: ms,
              format: (dict) => `${dict.errHostConnect}${dict.errTimeout(m, ms)}`
            });
          } else if (err?.code === 'NOT_IN_IFRAME' || err?.message === I18N['zh-CN'].errNotInIframe || err?.message === I18N['en'].errNotInIframe) {
            showError({
              type: 'host_init_not_in_iframe',
              format: (dict) => `${dict.errHostConnect}${dict.errNotInIframe}`
            });
          } else if (!err?.message || err?.message === I18N['zh-CN'].errHostTimeout || err?.message === I18N['en'].errHostTimeout) {
            showError({
              type: 'host_init_fallback',
              format: (dict) => `${dict.errHostConnect}${dict.errHostTimeout}`
            });
          } else {
            const rawMsg = err.message;
            showError({
              type: 'host_init_raw',
              detail: rawMsg,
              format: (dict) => `${dict.errHostConnect}${rawMsg}`
            });
          }
        }
      }

      // Bootstrap language before bridge
      currentLang = resolveInitialLanguage();
      setLanguage(languagePreference, false);

      initializeBridge();
    })();
  </script>
</body>
</html>
